name: Blue-Green Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version to deploy
        type: choice
        required: true
        default: BLUE
        options:
          - BLUE
          - GREEN
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "index.html"
      - "index-blue.html"
      - "deploy.sh"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: blue-green-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      DEPLOY_VERSION: ${{ inputs.version || 'GREEN' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment script
        run: bash -n deploy.sh

      - name: Validate SSH secret
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY_B64" || {
            echo "SSH secret is missing."
            exit 1
          }
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keygen -y -f /tmp/deploy_key >/dev/null
          rm -f /tmp/deploy_key
          echo "SSH private key format is valid."

      - name: Build selected application image
        run: |
          set -euo pipefail
          build_context="$(mktemp -d)"
          trap 'rm -rf "$build_context"' EXIT
          cp Dockerfile "$build_context/Dockerfile"

          if [ "$DEPLOY_VERSION" = "BLUE" ]; then
            cp index-blue.html "$build_context/index.html"
          else
            cp index.html "$build_context/index.html"
          fi

          docker build -t blue-green-app:incoming "$build_context"

      - name: Deploy through existing SSH connection
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/blue_green_deploy
          chmod 600 ~/.ssh/blue_green_deploy
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/blue_green_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            mahir@localhost \
            "DEPLOY_IMAGE=blue-green-app:incoming DEPLOY_VERSION='$DEPLOY_VERSION' bash '$GITHUB_WORKSPACE/deploy.sh'"

          rm -f ~/.ssh/blue_green_deploy
