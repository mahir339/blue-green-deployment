
name: Blue-Green Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "index.html"
      - "index-blue.html"
      - "deploy.sh"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: blue-green-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment script
        run: bash -n deploy.sh

      
      - name: Validate SSH secret
        env:
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_KEY_B64" ]; then
            echo "ERROR: DEPLOY_SSH_PRIVATE_KEY_B64 is empty or missing."
            exit 1
          fi

          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          if ! ssh-keygen -y -f /tmp/deploy_key > /dev/null; then
            echo "ERROR: Secret did not decode to a valid SSH private key."
            rm -f /tmp/deploy_key
            exit 1
          fi

          echo "SSH private key format is valid."
          rm -f /tmp/deploy_key

